<svg xmlns="http://www.w3.org/2000/svg" width="920" height="290" viewBox="0 0 920 290" role="img" aria-labelledby="title desc">
  <title id="title">AstroTaca connections</title>
  <desc id="desc">A Windows computer connects to AstroTaca Flat Panel over USB for control. A separate 12 volt DC power supply powers movement and light. The computer is optional for saved button operation. This is a connection overview, not a physical wiring drawing.</desc>
  <rect width="920" height="290" rx="16" fill="#f5f7f9"/>
  <g font-family="Segoe UI, Arial, sans-serif" fill="#17232e" text-anchor="middle">
    <rect x="30" y="36" width="234" height="100" rx="12" fill="#fff" stroke="#536b7a" stroke-width="2"/>
    <text x="147" y="77" font-size="23" font-weight="600">Windows PC</text>
    <text x="147" y="110" font-size="17">NINA or AstroTaca app</text>
    <rect x="30" y="168" width="234" height="80" rx="12" fill="#fff" stroke="#536b7a" stroke-width="2"/>
    <text x="147" y="201" font-size="23" font-weight="600">12 V DC supply</text>
    <text x="147" y="229" font-size="17">Use the specified supply</text>
    <rect x="562" y="58" width="326" height="190" rx="12" fill="#fff" stroke="#006b68" stroke-width="2"/>
    <text x="725" y="107" font-size="25" font-weight="600">AstroTaca Flat Panel</text>
    <text x="725" y="149" font-size="18">Cover movement + light</text>
    <text x="725" y="202" font-size="17">Saved button presets work</text>
    <text x="725" y="226" font-size="17">without a computer</text>
    <path d="M264 86 H562 M264 208 H562" fill="none" stroke="#006b68" stroke-width="4"/>
    <rect x="328" y="66" width="170" height="40" rx="6" fill="#f5f7f9"/>
    <text x="413" y="92" font-size="19">USB data cable</text>
    <rect x="339" y="188" width="148" height="40" rx="6" fill="#f5f7f9"/>
    <text x="413" y="214" font-size="19">Power cable</text>
    <text x="460" y="277" font-size="14" fill="#52616c">Connection overview only. Connector locations and shapes are not shown.</text>
  </g>
</svg>
